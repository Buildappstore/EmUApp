name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir dist
          cp index.html play.html api-config.js db.js sw.js manifest.webmanifest icon.svg dist/
          node <<'NODE'
          const fs = require('fs');
          const apiBaseUrl = process.env.API_BASE_URL || 'https://emuapp-b2-api.onrender.com';
          if (!apiBaseUrl) throw new Error('API_BASE_URL must not be empty');
          fs.writeFileSync('dist/api-config.js', `window.API_BASE_URL = ${JSON.stringify(apiBaseUrl)};\n`);
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
