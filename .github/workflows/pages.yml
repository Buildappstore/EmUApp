name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.API_BASE_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir dist
          cp index.html play.html api-config.js db.js sw.js manifest.webmanifest icon.svg dist/
          node -e "require('fs').writeFileSync('dist/api-config.js', 'window.API_BASE_URL = ' + JSON.stringify(process.env.API_BASE_URL) + ';\\n')"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
