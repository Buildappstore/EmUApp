<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Mi biblioteca de juegos</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b1020;
    --surface:#111a2b;
    --surface-raised:#172237;
    --border:rgba(160,177,211,.16);
    --text:#f3f6fc;
    --muted:#9ba9c1;
    --accent:#9aabff;
    --accent-strong:#788fff;
    --teal:#5be0c1;
    --shadow:0 18px 48px rgba(0,0,0,.24);
  }
  * { box-sizing:border-box; }
  body {
    min-height:100vh;
    margin:0;
    padding:clamp(16px,3vw,34px);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 86% -10%, rgba(86,111,203,.2), transparent 38rem),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  button, select, input[type=search] { font:inherit; }
  button, select {
    min-height:44px;
    color:var(--text);
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:12px;
  }
  button { padding:10px 15px; cursor:pointer; transition:transform .18s ease,background .18s ease,border-color .18s ease; }
  button:hover { border-color:rgba(154,171,255,.55); }
  button:active { transform:translateY(1px); }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
    outline:3px solid rgba(154,171,255,.65);
    outline-offset:2px;
  }
  .app-header, main { width:min(100%,1200px); margin-inline:auto; }
  .app-header { display:grid; gap:24px; margin-bottom:30px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand { display:flex; align-items:center; gap:14px; min-width:0; }
  .brand-mark {
    display:grid;
    place-items:center;
    width:54px;
    height:54px;
    flex:none;
    border:1px solid rgba(177,190,255,.28);
    border-radius:17px;
    background:linear-gradient(145deg,rgba(122,145,255,.3),rgba(67,211,187,.14));
    box-shadow:inset 0 1px rgba(255,255,255,.14);
    font-size:1.65rem;
  }
  .eyebrow { margin:0 0 3px; color:var(--teal); font-size:.7rem; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
  h1 { margin:0; font-size:clamp(1.45rem,3vw,2rem); letter-spacing:-.04em; line-height:1.1; }
  .header-actions { display:flex; align-items:center; gap:9px; }
  .primary {
    color:#10172a;
    background:linear-gradient(135deg,#b2bcff,#8298ff);
    border-color:transparent;
    box-shadow:0 8px 24px rgba(106,128,231,.24);
    font-weight:750;
  }
  .primary:hover { background:linear-gradient(135deg,#c1c9ff,#91a4ff); }
  .secondary { background:rgba(255,255,255,.035); }
  .toolbar {
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(250px,320px);
    gap:12px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:18px;
    background:rgba(17,26,43,.78);
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);
  }
  .search-box { position:relative; display:flex; align-items:center; min-width:0; }
  .search-icon { position:absolute; left:15px; color:var(--muted); font-size:1.25rem; pointer-events:none; }
  input[type=search] {
    width:100%;
    min-height:48px;
    padding:11px 14px 11px 44px;
    border:1px solid transparent;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    color:var(--text);
  }
  input[type=search]::placeholder { color:#8190aa; }
  .system-picker { display:grid; gap:4px; padding-inline:5px; }
  .system-picker label { padding-left:5px; color:var(--muted); font-size:.7rem; font-weight:700; letter-spacing:.04em; }
  .system-picker select { width:100%; padding:8px 12px; }
  .library-status { margin:0 0 20px; color:var(--muted); font-size:.88rem; }
  #info { display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:7px 12px;
          border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.035); }
  #info::before { width:7px; height:7px; border-radius:50%; background:var(--teal); content:""; }
  #grid { display:grid; gap:30px; }
  .system-heading {
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 13px;
    color:#e7ecfa;
    font-size:1.08rem;
    letter-spacing:-.02em;
  }
  .system-heading::after { height:1px; flex:1; background:linear-gradient(90deg,var(--border),transparent); content:""; }
  .system-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px; }
  .card {
    display:flex;
    min-width:0;
    flex-direction:column;
    gap:9px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:17px;
    background:linear-gradient(160deg,rgba(24,35,56,.98),rgba(15,23,39,.98));
    box-shadow:0 10px 30px rgba(0,0,0,.13);
    transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
  }
  .card:hover { transform:translateY(-3px); border-color:rgba(154,171,255,.38); box-shadow:var(--shadow); }
  .name { overflow-wrap:anywhere; color:var(--text); font-size:.94rem; font-weight:700; line-height:1.35; }
  .meta { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.78rem; }
  .badge {
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 9px;
    border:1px solid rgba(154,171,255,.2);
    border-radius:999px;
    background:rgba(125,146,255,.1);
    color:#bdc8ff;
    font-size:.69rem;
    font-weight:750;
    letter-spacing:.02em;
  }
  .cover {
    display:grid;
    width:100%;
    height:clamp(128px,16vw,180px);
    place-items:center;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    background:
      radial-gradient(circle at 50% 30%,rgba(106,131,204,.16),transparent 58%),
      #0d1422;
    color:#8290a9;
    font-size:.83rem;
  }
  .cover img { width:100%; height:100%; object-fit:contain; }
  .cover-button { width:100%; padding:8px 10px; color:#c7d0e2; font-size:.8rem; }
  .system-assignment { display:grid; gap:7px; }
  .system-assignment button { min-height:40px; padding:8px 10px; font-size:.82rem; }
  .system-assignment select { width:100%; min-width:0; padding:8px; font-size:.83rem; }
  .row { display:flex; gap:8px; margin-top:auto; }
  .row a {
    display:flex;
    min-height:44px;
    flex:1;
    align-items:center;
    justify-content:center;
    border:1px solid transparent;
    border-radius:12px;
    background:linear-gradient(135deg,#aebaff,#8095ff);
    color:#11182b;
    font-size:.88rem;
    font-weight:800;
    text-decoration:none;
  }
  #empty {
    max-width:560px;
    margin:56px auto;
    padding:36px 24px;
    border:1px dashed rgba(160,177,211,.25);
    border-radius:20px;
    background:rgba(255,255,255,.025);
    color:var(--muted);
    line-height:1.6;
    text-align:center;
  }
  @media (max-width:680px) {
    body { padding:16px; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
    .app-header { gap:17px; margin-bottom:23px; }
    .topbar { align-items:flex-start; }
    .brand-mark { width:46px; height:46px; border-radius:14px; font-size:1.4rem; }
    .toolbar { grid-template-columns:1fr; gap:8px; padding:9px; }
    .system-picker { padding:4px; }
    .library-status { margin-bottom:16px; }
    .system-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .card { gap:8px; padding:9px; border-radius:14px; }
    .cover { height:130px; }
    .cover { border-radius:10px; }
    .name { font-size:.85rem; }
    .meta { flex-wrap:wrap; gap:6px; font-size:.72rem; }
    .cover-button { padding:8px 5px; font-size:.73rem; }
    .row a { min-height:42px; font-size:.82rem; }
  }
  @media (max-width:440px) {
    .topbar { flex-wrap:wrap; }
    .header-actions { width:100%; }
    .header-actions button { flex:1; padding-inline:9px; font-size:.84rem; }
    .system-heading { font-size:.98rem; }
  }
  @media (max-width:350px) {
    .system-grid { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🎮</div>
      <div>
        <p class="eyebrow">EmUApp · colección personal</p>
        <h1>Mi biblioteca</h1>
      </div>
    </div>
    <div class="header-actions">
      <button class="secondary" id="refresh" type="button">↻ Actualizar</button>
      <button class="primary" id="add" type="button">＋ Agregar juegos</button>
    </div>
  </div>
  <div class="toolbar">
    <label class="search-box">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" id="q" placeholder="Buscar en tu biblioteca…" aria-label="Buscar juegos">
    </label>
    <div class="system-picker">
      <label for="sys">SISTEMA PARA ARCHIVOS COMPRIMIDOS</label>
      <select id="sys" title="Sistema para archivos .zip, .7z o .bin">
        <option value="auto">ZIP/BIN: elegir sistema…</option>
        <option value="nes">NES</option>
        <option value="snes">SNES</option>
        <option value="gb">Game Boy / Color</option>
        <option value="gba">GBA</option>
        <option value="segaMD">Mega Drive</option>
        <option value="n64">N64</option>
        <option value="nds">Nintendo DS</option>
        <option value="3ds">Nintendo 3DS</option>
        <option value="psx">PlayStation</option>
      </select>
    </div>
  </div>
  <input type="file" id="file" multiple hidden>
</header>
<main>
  <div id="info" class="library-status" role="status" aria-live="polite"></div>
  <div id="grid"></div>
  <div id="empty" hidden>Aún no hay juegos en el bucket. Agrega tus ROMs para verlos aquí.</div>
</main>

<script src="api-config.js"></script>
<script src="db.js"></script>
<script>
const EXT = {
  nes:'nes', fds:'nes', sfc:'snes', smc:'snes', gb:'gb', gbc:'gb', gba:'gba',
  md:'segaMD', gen:'segaMD', smd:'segaMD', n64:'n64', z64:'n64', v64:'n64',
  nds:'nds', '3ds':'3ds', cci:'3ds', cxi:'3ds', cue:'psx', iso:'psx', pbp:'psx', chd:'psx'
};
const LABEL = { nes:'NES', snes:'SNES', gb:'GB/GBC', gba:'GBA', segaMD:'Mega Drive', n64:'N64', nds:'NDS', '3ds':'Nintendo 3DS', psx:'PSX' };
const SYSTEM_ORDER = ['nes', 'snes', 'gb', 'gba', 'segaMD', 'n64', 'nds', '3ds', 'psx', 'auto'];
const $ = id => document.getElementById(id);
const fmt = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : (b/1e6).toFixed(1)+' MB';
let all = [];

async function render() {
  $('info').textContent = 'Cargando biblioteca de Backblaze B2…';
  try {
    all = await listRoms();
  } catch (error) {
    $('grid').innerHTML = '';
    $('empty').hidden = true;
    $('info').textContent = `No se pudo cargar la biblioteca de B2: ${error.message}`;
    return;
  }
  const q = $('q').value.toLowerCase();
  const list = all.filter(r => r.name.toLowerCase().includes(q))
                  .sort((a,b) => a.name.localeCompare(b.name));
  $('grid').innerHTML = '';
  $('empty').hidden = list.length > 0;
  const grouped = new Map();
  for (const r of list) {
    const key = LABEL[r.core] ? r.core : 'auto';
    if (!grouped.has(key)) {
      grouped.set(key, { key, label: LABEL[key] || 'Sistema por elegir', games: [] });
    }
    grouped.get(key).games.push(r);
  }
  const groups = [...grouped.values()].sort((a, b) =>
    SYSTEM_ORDER.indexOf(a.key) - SYSTEM_ORDER.indexOf(b.key) || a.label.localeCompare(b.label)
  );

  for (const group of groups) {
    const section = document.createElement('section');
    const heading = document.createElement('h2');
    heading.className = 'system-heading';
    heading.textContent = `${group.label} (${group.games.length})`;
    const cards = document.createElement('div');
    cards.className = 'system-grid';

    for (const r of group.games) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<div class="name"></div>
        <div class="cover"></div>
        <div class="meta"><span class="badge">${r.core === 'auto' ? 'ZIP · elegir sistema' : LABEL[r.core] || r.core}</span> ${fmt(r.size)}</div>
        <button class="cover-button" type="button">${r.coverUrl ? 'Cambiar carátula' : 'Agregar carátula'}</button>
        <div class="row"><a href="play.html?id=${encodeURIComponent(r.id)}">${r.core === 'auto' ? 'Elegir sistema' : 'Jugar'}</a></div>`;
      d.querySelector('.name').textContent = r.name;
      const cover = d.querySelector('.cover');
      if (r.coverUrl) {
        const image = document.createElement('img');
        image.src = r.coverUrl;
        image.alt = `Carátula de ${r.name}`;
        image.loading = 'lazy';
        cover.appendChild(image);
      } else {
        cover.textContent = 'Sin carátula';
      }

      const coverInput = document.createElement('input');
      coverInput.type = 'file';
      coverInput.accept = 'image/jpeg,image/png,image/webp,image/gif';
      coverInput.hidden = true;
      coverInput.onchange = async () => {
        const file = coverInput.files?.[0];
        if (!file) return;
        try {
          await setRomCover(r.id, file);
          await render();
        } catch (error) {
          alert(`No se pudo guardar la carátula: ${error.message}`);
        } finally {
          coverInput.value = '';
        }
      };
      d.querySelector('.cover-button').onclick = () => coverInput.click();
      d.appendChild(coverInput);

      if (r.core === 'auto') {
        const assignment = document.createElement('div');
        assignment.className = 'system-assignment';
        const select = document.createElement('select');
        select.setAttribute('aria-label', `Sistema de ${r.name}`);
        const placeholder = document.createElement('option');
        placeholder.value = 'auto';
        placeholder.textContent = 'Elegir sistema…';
        select.appendChild(placeholder);
        for (const [core, label] of Object.entries(LABEL)) {
          const option = document.createElement('option');
          option.value = core;
          option.textContent = label;
          select.appendChild(option);
        }
        if (LABEL[$('sys').value]) select.value = $('sys').value;

        const save = document.createElement('button');
        save.type = 'button';
        save.textContent = 'Guardar sistema';
        save.onclick = async () => {
          if (!LABEL[select.value]) {
            alert('Elige el sistema de esta ROM.');
            return;
          }
          save.disabled = true;
          try {
            await setRomCore(r.id, select.value);
            await render();
          } catch (error) {
            alert(`No se pudo guardar el sistema: ${error.message}`);
          } finally {
            save.disabled = false;
          }
        };
        assignment.append(select, save);
        d.insertBefore(assignment, d.querySelector('.cover-button'));

        d.querySelector('.row a').onclick = event => {
          event.preventDefault();
          const selectedCore = $('sys').value;
          if (!LABEL[selectedCore]) {
            alert('Selecciona el sistema del ZIP en el menú o guárdalo en esta tarjeta.');
            return;
          }
          location.href = `play.html?id=${encodeURIComponent(r.id)}&core=${encodeURIComponent(selectedCore)}`;
        };
      }
      cards.appendChild(d);
    }
    section.append(heading, cards);
    $('grid').appendChild(section);
  }
  storageInfo();
}

async function storageInfo() {
  $('info').textContent = `${all.length} juego(s) en Backblaze B2`;
}

$('add').onclick = () => $('file').click();
$('refresh').onclick = render;
$('q').oninput = render;
window.addEventListener('focus', render);

$('file').onchange = async e => {
  if (navigator.storage?.persist) navigator.storage.persist(); // pide que el navegador no borre los datos
  const skipped = [];
  for (const f of e.target.files) {
    const ext = f.name.split('.').pop().toLowerCase();
    let core = EXT[ext];
    if (!core) core = $('sys').value !== 'auto' ? $('sys').value : null;
    if (!core) { skipped.push(f.name); continue; }
    try {
      await addRom({ name: f.name.replace(/\.[^.]+$/, ''), core, size: f.size, added: Date.now() }, f);
    } catch (err) {
      alert('No se pudo guardar "' + f.name + '" (¿espacio insuficiente?).');
    }
  }
  e.target.value = '';
  if (skipped.length) alert('Elige primero el sistema en el menú para estos archivos:\n' + skipped.join('\n'));
  render();
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
